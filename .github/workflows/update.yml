name: Update Football Highlights Data

on:
  workflow_dispatch: # Keeps manual trigger available
  schedule:
    - cron: '0 */2 * * *' # Automatically runs every 2 hours

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run fetch script
        run: python update_matches.py

      - name: Commit and push if matches.json changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated match data update [skip ci]"
          file_pattern: matches.json
