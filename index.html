<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Pitch - Spoiler-Free Football</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">⚽ Quiet Pitch</div>
            <div class="spoiler-badge">Spoilers: hidden</div>
        </header>

        <div class="nav-tabs">
            <a class="nav-tab active">Scores & fixtures</a>
            <a class="nav-tab">Table</a>
            <a class="nav-tab">Top games</a>
            <a class="nav-tab">Saved</a>
            <a class="nav-tab">Settings</a>
        </div>

        <div class="section-title">Premier League · 2026-27</div>
        <div class="section-subtitle">Today's fixtures & results</div>

        <div id="matches-container">
            <!-- Matches load dynamically via script.js -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
